# Mount point for the dsh-pathfinder line: `dsh plugin add` installs it, so a profile never needs
# manual edits to cordis.patch.yml. The profile layer can still disable the line by id.
#
# This id is the line's identity and also the name of its settings namespace — in DSH one plugin
# line is one settings namespace (`packages/settings/settings`), and the settings-page section is
# registered by the browser half with `SETTINGS_NAMESPACE` equal to this id. Changing the id moves
# the namespace, and the panel section silently lands where no data is read.

- insert:
    - id: pathfinder
      name: dsh-pathfinder